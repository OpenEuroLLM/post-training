# One-node test of the post-training backend of oellm-autoexp on MareNostrum 5.
# Same model, container, tokenizer and training settings as configs/trl/sft-ablation-run2-no-think.yaml.
# Different: 1 node, 30 steps, short sequences (the ZeRO-2 optimizer partition of each GPU is 8 times
# larger with 4 GPUs than with 32), one small dataset, a checkpoint every 10 steps.
# The run directory is below outputs_autoexp/, not below outputs_sft/ where the real runs are.
# Enqueue (in the oellm-autoexp checkout; the backend prepares the run directory itself):
#   python scripts/run_autoexp.py --no-monitor --pool <pool_dir> \
#       --config-name experiments/post_training/launch_mn5 slurm.sbatch.nodes=1 \
#       backend.config=configs/trl/autoexp-backend-test-1node.yaml
method: sft
backend: trl
llamafactory: null
run_name: autoexp-backend-test-1node
offline: true

container:
  image: /gpfs/scratch/ehpc533/users/frei322049/containers/post-training.sif
  bind_mounts:
    - /gpfs/scratch/ehpc533/users/frei322049
  env_file: env/mn5.env
  path: /usr/local/bin:/usr/bin:/bin:/opt/venv/bin

model:
  name_or_path: "/gpfs/scratch/ehpc533/users/frei322049/models/prelude-long"
  tokenizer_name_or_path: "/gpfs/scratch/ehpc533/users/frei322049/models/openeurollm-tokenizer-256k"
  tokenizer_revision: "qwen3-tokens"
  attn_implementation: "flash_attention_3"
  dtype: "bfloat16"

training:
  max_steps: 30
  num_train_epochs: null
  num_training_samples: null
  num_training_tokens: null
  learning_rate: 8.0e-5
  lr_scheduler_type: "linear"
  lr_scheduler_kwargs: null
  warmup_steps: 0.03
  weight_decay: 0.0
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_epsilon: 1e-8
  effective_batch_size: 32
  per_device_train_batch_size: 1
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false
    determinism_check: "default"
    debug: false
    early_stop: true
  use_liger_kernel: true
  bf16: true
  seed: 42

sft:
  max_seq_length: 4096
  packing: true
  dataset_num_proc: 16
  truncated_span_action: "drop"

thinking_conditioning:
  enable: true
  default_mode_omission_probability: 0.5

data:
  chat_template: "qwen3"
  num_proc: 32
  seed: 42
  datasets:
    - name: "identity-all"
      path: "/gpfs/scratch/ehpc533/users/frei322049/datasets/SFT-ablation-data/shards/identity/all"
      split: "train"
      weight: 1.0
      transform: null

deepspeed:
  bf16:
    enabled: true
  zero_optimization:
    stage: 2
    overlap_comm: false
    contiguous_gradients: true
    reduce_scatter: true
  gradient_clipping: 1.0
  train_micro_batch_size_per_gpu: "auto"
  gradient_accumulation_steps: "auto"
  train_batch_size: "auto"
  optimizer:
    type: AdamW
    params:
      lr: "auto"
      betas: "auto"
      eps: "auto"
      weight_decay: "auto"

accelerate:
  mixed_precision: "bf16"
  use_deepspeed: true
  deepspeed_multinode_launcher: "standard"
  same_network: true
  rdzv_backend: "static"
  dynamo_backend: "inductor"

checkpointing:
  save_strategy: "steps"
  save_steps: 10
  save_total_limit: 2
  inference_checkpoint_steps: 20
  inference_checkpoint_path: "inference_checkpoints"

logging:
  report_to:
    - "wandb"
    - "tensorboard"
  wandb_project: "autoexp-pool-test"
  logging_steps: 1
  include_num_input_tokens_seen: "non_padding"

slurm:
  account: "ehpc533"
  partition: "acc_ehpc"
  qos: "acc_ehpc"
  num_nodes: 1
  gpus_per_node: 4
  cpus_per_task: 76
  wall_time: "02:00:00"
  job_name: "autoexp-backend-test-1node"
  signal_time_seconds: 300
  max_failures: 3
  modules:
    - "cuda/12.6"
    - "gcc/11.4.0"
    - "singularity"
  module_purge: false

debug:
  enabled: false
  override_existing: false

paths:
  output_base: "outputs_autoexp"
  debug_base: "outputs_autoexp/debug"
