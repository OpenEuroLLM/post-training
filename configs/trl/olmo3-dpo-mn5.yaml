# DPO on OLMo 3 7B Instruct SFT, MN5, FSDP2, TRL 1.17.1.
# TRL 1.17.1 always uses its fused LM head: the full logits tensor is never built.
# The reference model is scored once before training (precompute_ref_log_probs)
# and then freed, so training holds only the policy.
method: dpo
run_name: your-run-name
offline: true
backend: trl
llamafactory: null
container:
  image: /gpfs/projects/ehpc533/containers/post-training-trlv1.17.1.sif
  bind_mounts:
  - /path/to/your/user
  env_file: env/mn5.env
  path: /usr/local/bin:/usr/bin:/bin:/opt/venv/bin
prefetch_assets: true
model:
  # Local copy of allenai/Olmo-3-7B-Instruct-SFT (the OLMo 3 checkpoint that DPO starts from).
  name_or_path: /path/to/your/model
  # Native FA3 when the flash-attn-3 package is in the image. Without it, transformers 5.13
  # falls back to the Hub kernel kernels-community/vllm-flash-attn3, which must already be
  # in HF_HUB_CACHE because the job runs with offline: true.
  attn_implementation: flash_attention_3
  dtype: bfloat16
  revision: null
  tokenizer_name_or_path: null               # null = take the tokenizer from the model directory
  tokenizer_revision: null
training:
  max_steps: 100                             # test run
  learning_rate: 1.0e-06                     # DPO learning rate (the SFT-scale 8e-5 diverges in DPO)
  effective_batch_size: 128
  per_device_train_batch_size: 1
  warmup_steps: 0.1
  lr_scheduler_type: linear
  lr_scheduler_kwargs: null
  adam_beta1: 0.9
  adam_beta2: 0.95
  weight_decay: 0.0
  adam_epsilon: 1.0e-08
  # HF gradient checkpointing breaks on OLMo 3 under FSDP2: the FSDP2 pre-forward hook casts
  # the fp32 RoPE cos/sin to bf16 in forward but not in the recompute. fsdp.activation_checkpointing
  # does the checkpointing instead.
  gradient_checkpointing: false
  gradient_checkpointing_kwargs:
    use_reentrant: false
    determinism_check: default
    debug: false
    early_stop: false
  bf16: true
  seed: 42
  # Deprecated in TRL 1.17.1 (removal in 2.0). Liger would patch only the layers; the loss
  # always goes through TRL's fused LM head.
  use_liger_kernel: false
  liger_kernel_config: null
checkpointing:
  save_strategy: steps
  save_steps: 250
  save_total_limit: 2
  inference_checkpoint_steps: 250
  inference_checkpoint_path: inference_checkpoints
data:
  chat_template: olmo3-instruct-sft
  num_proc: null
  seed: 42
  datasets:
  - name: your-dataset-name
    path: /path/to/your/dataset
    weight: 1.0
    transform: null                        # null = already conversational
dpo:
  beta: 5.0
  loss_type: sigmoid
  ref_model_name_or_path: null
  max_seq_length: 4096
  dataset_num_proc: null
  # Under FSDP, TRL 1.17.1 loads the reference model, shards it as one FSDP2 unit, scores
  # the whole dataset with it (no_grad, fused LM head), caches the result next to the
  # dataset cache (fingerprint = dataset fingerprint + model hash), and drops the model.
  precompute_ref_log_probs: true
  precompute_ref_batch_size: 8               # pairs per GPU in the precompute pass (default would be 1)

# -- FSDP --------------------------------------------------------------------
# FSDP2 with SHARD_GRAD_OP (reshard_after_forward: false) is the closest match to
# ZeRO-2. Use FULL_SHARD to also free the gathered params after forward.
deepspeed: null
fsdp:
  version: 2
  sharding_strategy: SHARD_GRAD_OP
  auto_wrap_policy: TRANSFORMER_BASED_WRAP
  transformer_layer_cls_to_wrap: null       # null = the model's _no_split_modules (Olmo3DecoderLayer)
  state_dict_type: SHARDED_STATE_DICT        # format of the resumable checkpoints/
  offload_params: false
  cpu_ram_efficient_loading: false
  sync_module_states: true
  activation_checkpointing: true             # checkpoint_wrapper on each decoder layer's children; see training.gradient_checkpointing

accelerate:
  mixed_precision: bf16
  use_deepspeed: true
  deepspeed_multinode_launcher: standard
  same_network: true
  rdzv_backend: static
  dynamo_backend: "no"
logging:
  report_to:
  - wandb
  - tensorboard
  wandb_project: instruction-selection
  logging_steps: 10
  include_num_input_tokens_seen: non_padding
slurm:
  partition: your_partition
  account: your_account
  qos: your_qos
  num_nodes: 8
  gpus_per_node: 4
  cpus_per_task: 80
  cpus_per_gpu: null
  mem: null
  wall_time: '00:25:00'
  job_name: dpo-olmo3-test
  signal_time_seconds: 300
  max_failures: 3
  modules:
  - EB/apps
  - CUDA/12.4.0
  - gcc/12.3.0
  - singularity
  module_purge: false
debug:
  enabled: false
  override_existing: false
paths:
  output_base: /path/to/your/outputs
  debug_base: /path/to/your/outputs/debug

